<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Smultronstället</title>
    <style>
      :root {
        color-scheme: light dark;
        --border: oklch(0.9 0 0);
        --border-soft: oklch(0.945 0 0);
        --muted: oklch(0.55 0 0);
        --accent: oklch(0.51 0.2 8); /* strawberry crimson, ≈#bb0a50 */
        --err: #b02a2a;
        --accent-solid: oklch(0.51 0.2 8);
        --fg: oklch(0.2 0 0);
        --card: #fff;
        --focus-bg: oklch(0.98 0 0);
        --chip-bg: oklch(0.962 0 0);
        --chip-fg: oklch(0.45 0 0);
        --faint: oklch(0.65 0 0);
        --faint-hover: oklch(0.3 0 0);
        --placeholder: oklch(0.7 0 0);
        --input-border: oklch(0.92 0 0);
        --btn-fg: oklch(0.4 0 0);
        --soft: oklch(0.97 0 0);
        --message: oklch(0.45 0 0);
        --dot: oklch(0.75 0 0);
        --ok: oklch(0.55 0.12 150);
        --ok-dot: oklch(0.65 0.15 150);
        --arch: oklch(0.5 0 0);
        --arch-dot: oklch(0.7 0 0);
        --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      body {
        margin: 0;
        width: 360px;
        background: transparent;
        color: var(--fg);
        font: 13px/1.4 ui-sans-serif, system-ui, sans-serif;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px;
        border-bottom: 1px solid var(--border-soft);
      }
      /* Button, not a label: it opens the site. Negative margin cancels the
         hover padding so the header keeps its original metrics. */
      .brand {
        margin: -3px -6px;
        padding: 3px 6px;
        border: none;
        border-radius: 5px;
        background: none;
        color: inherit;
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: -0.025em;
        cursor: pointer;
      }
      .brand:hover {
        background: var(--soft);
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--muted);
      }
      .status .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--dot);
      }
      .status.bookmarked {
        color: var(--ok);
      }
      .status.bookmarked .dot {
        background: var(--ok-dot);
      }
      .status.archived {
        color: var(--arch);
      }
      .status.archived .dot {
        background: var(--arch-dot);
      }
      .body {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 14px;
      }
      .page-row {
        display: flex;
        align-items: flex-start;
        gap: 10px;
      }
      .favicon {
        flex: none;
        width: 16px;
        height: 16px;
        margin-top: 3px;
        border-radius: 3px;
      }
      .page-col {
        display: flex;
        flex: 1;
        min-width: 0;
        flex-direction: column;
        gap: 2px;
      }
      .title-input {
        width: 100%;
        box-sizing: border-box;
        margin: -2px -4px;
        padding: 2px 4px;
        border: none;
        border-radius: 4px;
        background: transparent;
        color: inherit;
        font: inherit;
        font-size: 13px;
        font-weight: 500;
        outline: none;
      }
      .title-input:focus {
        background: var(--focus-bg);
      }
      .page-title {
        font-size: 13px;
        font-weight: 500;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .page-url {
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--muted);
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .block {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .block-label {
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.08em;
        color: var(--muted);
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 5px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 2px 7px;
        border-radius: 4px;
        background: var(--chip-bg);
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--chip-fg);
      }
      .chip-remove {
        padding: 0;
        border: none;
        background: none;
        font-size: 10px;
        line-height: 1;
        color: var(--faint);
        cursor: pointer;
      }
      .chip-remove:hover {
        color: var(--faint-hover);
      }
      .tag-input {
        width: 80px;
        border: none;
        background: transparent;
        font-family: var(--mono);
        font-size: 10.5px;
        color: inherit;
        outline: none;
      }
      .tag-input::placeholder {
        color: var(--placeholder);
      }
      /* m14 tag autocomplete: the dropdown overlays the NOTE block below
         rather than reflowing the card. */
      .tag-field {
        position: relative;
      }
      .suggestions {
        position: absolute;
        z-index: 10;
        top: calc(100% + 5px);
        left: 0;
        box-sizing: border-box;
        width: 100%;
        max-height: 152px;
        overflow-y: auto;
        padding: 3px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--card);
      }
      .suggestion {
        padding: 3px 7px;
        border-radius: 4px;
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--chip-fg);
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        cursor: pointer;
      }
      .suggestion:hover {
        background: var(--soft);
        color: var(--fg);
      }
      /* Keyboard highlight gets the accent-tinted active treatment the
         pinned button uses. */
      .suggestion.active {
        background: color-mix(in oklab, var(--accent) 10%, transparent);
        color: var(--accent);
      }
      .note-input {
        width: 100%;
        box-sizing: border-box;
        padding: 7px 10px;
        border: 1px solid var(--input-border);
        border-radius: 6px;
        background: var(--card);
        color: inherit;
        font: inherit;
        font-size: 12px;
        line-height: 1.5;
        resize: none;
        outline: none;
      }
      .note-input:focus {
        border-color: var(--accent);
      }
      .note-input::placeholder {
        color: var(--placeholder);
      }
      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .footer-actions {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .saved-line {
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--muted);
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .btn-secondary {
        padding: 5px 10px;
        border: 1px solid var(--input-border);
        border-radius: 6px;
        background: var(--card);
        font: inherit;
        font-size: 11.5px;
        color: var(--btn-fg);
        cursor: pointer;
      }
      .btn-secondary:hover {
        background: var(--soft);
      }
      /* m13 pin toggle: resting = btn-secondary look; .pinned takes the
         accent-tinted state from the Extension Popup mock (border 35%,
         fill 6%, accent text). */
      .btn-pin {
        padding: 5px 10px;
        border: 1px solid var(--input-border);
        border-radius: 6px;
        background: var(--card);
        font: inherit;
        font-size: 11.5px;
        color: var(--btn-fg);
        cursor: pointer;
      }
      .btn-pin:hover {
        background: var(--soft);
      }
      .btn-pin.pinned {
        border-color: color-mix(in oklab, var(--accent) 35%, transparent);
        background: color-mix(in oklab, var(--accent) 6%, transparent);
        color: var(--accent);
      }
      .btn-pin.pinned:hover {
        background: color-mix(in oklab, var(--accent) 12%, transparent);
      }
      .btn-accent {
        padding: 5px 12px;
        border: none;
        border-radius: 6px;
        background: var(--accent-solid);
        font: inherit;
        font-size: 11.5px;
        font-weight: 500;
        color: #fff;
        cursor: pointer;
      }
      .btn-accent:hover {
        filter: brightness(1.1);
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .message {
        font-size: 12px;
        color: var(--message);
      }
      .error-line {
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--err);
      }
      .hidden {
        display: none;
      }
      /* Dark values from the approved Claude Design [data-theme=dark] token
         block (Extension Popup mock). Deviations as on the web client
         (globals.css): strawberry-crimson accent instead of the mock's
         indigo, and the dark text/border accent brightens for legibility
         while the solid Save button keeps the deep crimson. */
      @media (prefers-color-scheme: dark) {
        :root {
          --border: oklch(1 0 0 / 12%);
          --border-soft: oklch(1 0 0 / 8%);
          --muted: oklch(0.708 0 0);
          --accent: oklch(0.68 0.158 8); /* ≈#e76986 */
          --err: #f87171;
          --fg: oklch(0.92 0 0);
          --card: oklch(0.205 0 0);
          --focus-bg: oklch(0.25 0 0);
          --chip-bg: oklch(0.269 0 0);
          --chip-fg: oklch(0.76 0 0);
          --faint: oklch(0.62 0 0);
          --faint-hover: oklch(0.92 0 0);
          --placeholder: oklch(0.55 0 0);
          --input-border: oklch(1 0 0 / 12%);
          --btn-fg: oklch(0.8 0 0);
          --soft: oklch(0.269 0 0);
          --message: oklch(0.708 0 0);
          --dot: oklch(0.45 0 0);
          --ok: oklch(0.75 0.12 150);
          --ok-dot: oklch(0.7 0.14 150);
          --arch: oklch(0.65 0 0);
          --arch-dot: oklch(0.5 0 0);
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <header class="header">
        <button class="brand" id="brand" type="button" title="Open Smultronstället">
          <span aria-hidden="true">🍓</span> Smultronstället
        </button>
        <span class="status" id="status">
          <span class="dot"></span>
          <span id="status-label">…</span>
        </span>
      </header>
      <div class="body" id="view"></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
