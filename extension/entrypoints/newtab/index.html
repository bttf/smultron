<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>New Tab</title>
    <style>
      /* Palette is the popup's token set (SPEC §9 theming: extension surfaces
         follow the browser's own scheme — media query only, no preference),
         plus the page-level tokens a full viewport needs. */
      :root {
        color-scheme: light dark;
        --page-bg: oklch(0.985 0 0);
        --border: oklch(0.9 0 0);
        --border-soft: oklch(0.945 0 0);
        --muted: oklch(0.55 0 0);
        --accent: oklch(0.51 0.2 8); /* strawberry crimson, ≈#bb0a50 */
        --err: #b02a2a;
        --fg: oklch(0.2 0 0);
        --card: #fff;
        --chip-bg: oklch(0.962 0 0);
        --chip-fg: oklch(0.45 0 0);
        --faint: oklch(0.65 0 0);
        --placeholder: oklch(0.7 0 0);
        --input-border: oklch(0.92 0 0);
        --btn-fg: oklch(0.4 0 0);
        --soft: oklch(0.97 0 0);
        --message: oklch(0.45 0 0);
        --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page-bg: oklch(0.165 0 0);
          --border: oklch(1 0 0 / 12%);
          --border-soft: oklch(1 0 0 / 8%);
          --muted: oklch(0.708 0 0);
          --accent: oklch(0.68 0.158 8); /* ≈#e76986 */
          --err: #f87171;
          --fg: oklch(0.92 0 0);
          --card: oklch(0.205 0 0);
          --chip-bg: oklch(0.269 0 0);
          --chip-fg: oklch(0.76 0 0);
          --faint: oklch(0.62 0 0);
          --placeholder: oklch(0.55 0 0);
          --input-border: oklch(1 0 0 / 12%);
          --btn-fg: oklch(0.8 0 0);
          --soft: oklch(0.269 0 0);
          --message: oklch(0.708 0 0);
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--page-bg);
        color: var(--fg);
        font: 13px/1.4 ui-sans-serif, system-ui, sans-serif;
      }
      .page {
        max-width: 820px;
        margin: 0 auto;
        padding: 84px 24px 64px;
      }
      .top {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 18px;
      }
      /* Button, not a link: it opens the configured base URL, resolved per
         click (same rule as the popup's header). */
      .brand {
        margin: -4px -8px;
        padding: 4px 8px;
        border: none;
        border-radius: 6px;
        background: none;
        color: inherit;
        font: inherit;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.025em;
        cursor: pointer;
      }
      .brand:hover {
        background: var(--soft);
      }
      .meta {
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--muted);
      }
      .meta.stale {
        font-style: italic;
      }
      .search {
        width: 100%;
        padding: 11px 14px;
        border: 1px solid var(--input-border);
        border-radius: 8px;
        background: var(--card);
        color: inherit;
        font: inherit;
        font-size: 13px;
        outline: none;
      }
      .search:focus {
        border-color: var(--accent);
      }
      .search::placeholder {
        color: var(--placeholder);
      }
      .section {
        margin-top: 26px;
      }
      .section-label {
        display: flex;
        align-items: baseline;
        gap: 7px;
        margin-bottom: 9px;
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.08em;
        color: var(--muted);
      }
      .count {
        color: var(--faint);
      }
      /* Pinned shelf — the site's card grid (SPEC §9), narrower gutters. */
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
        gap: 8px;
      }
      .card {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 10px 11px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--card);
        color: inherit;
        text-decoration: none;
        /* RED-206: the whole card grows on hover, screenshot or not — the
           growth belongs to the card, not to the image. `relative` is what
           lets the grown card sit over its neighbours rather than under
           them. */
        position: relative;
        transform: scale(1);
        transition: transform 250ms ease-out;
      }
      .card:hover,
      .card:focus-within {
        border-color: color-mix(in oklab, var(--accent) 35%, transparent);
        transform: scale(1.03);
        z-index: 2;
      }
      /* The shelf is drag-sortable (m21, SPEC §6) — native HTML5 DnD, so the
         reflow is instant DOM moves rather than an animated transform. */
      .card {
        cursor: grab;
      }
      .card:active {
        cursor: grabbing;
      }
      .card.dragging {
        opacity: 0.4;
        /* A lifted card holds still; the drag itself is the motion. Dropped
           instantly rather than eased out, so the drag image Chrome snapshots
           at `dragstart` is the card at its true size. */
        transform: none;
        transition: none;
      }
      .card-host {
        display: flex;
        align-items: center;
        gap: 6px;
        font-family: var(--mono);
        font-size: 10px;
        color: var(--muted);
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .card-title {
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        line-clamp: 2;
        overflow: hidden;
        font-size: 12px;
        font-weight: 500;
      }
      .favicon {
        flex: none;
        width: 16px;
        height: 16px;
        border-radius: 3px;
      }
      .card .favicon {
        width: 14px;
        height: 14px;
      }
      /* m23 screenshot cards (SPEC §15.5). The image and the black overlay are
         absolutely positioned layers under the card's own content; a card
         without a screenshot never gets the `shot` class and is unchanged. */
      .card.shot {
        overflow: hidden;
      }
      .card-shot {
        position: absolute;
        inset: 0;
        /* Sized by its own insets, so the box is definite whatever the JPEG's
           aspect ratio is and `cover` fills the card in both directions. */
        width: 100%;
        height: 100%;
        object-fit: cover;
        /* The top of the page is the recognizable part, so that is the rest
           position; hover pans towards the bottom. RED-206 drives the pan from
           `main.ts` (inline `object-position` + an inline transition) so that
           hover-off can FREEZE it where it stands instead of sliding back. */
        object-position: 50% 0%;
        pointer-events: none;
      }
      .card-shade {
        position: absolute;
        inset: 0;
        background: #000;
        opacity: 0.45;
        pointer-events: none;
      }
      /* The card's existing content, lifted above both layers. */
      .card.shot > .card-host,
      .card.shot > .card-title {
        position: relative;
        z-index: 1;
      }
      .card.shot > .card-title {
        color: #fff;
      }
      .card.shot > .card-host {
        /* 90%, not less. RED-206 lightened the overlay to 0.45, so the worst
           case — a white page — now reads ~3.1:1 rather than ~4.2:1; 90% is
           what keeps the host line from dropping further still. */
        color: rgb(255 255 255 / 90%);
      }
      /* No pan, no growth. The overlay and the white text stay: they are not
         motion. The pan is JS-driven, so `main.ts` checks the same query and
         writes no inline `object-position` at all — an inline value would
         outrank this block. */
      @media (prefers-reduced-motion: reduce) {
        .card,
        .card:hover,
        .card:focus-within {
          transform: none;
          transition: none;
        }
        .card-shot {
          object-position: 50% 0%;
          transition: none;
        }
      }
      /* Log rows — the feed's dense line (SPEC §9). */
      .log {
        display: flex;
        flex-direction: column;
      }
      .row {
        display: grid;
        /* Title takes space priority and the URL truncates first, as in the
           feed's log rows (SPEC §9); the URL is right-aligned so a short one
           still sits against the tag chips. */
        grid-template-columns: 16px minmax(0, 2fr) minmax(0, 1fr) auto auto;
        align-items: center;
        gap: 10px;
        padding: 7px 8px;
        border-bottom: 1px solid var(--border-soft);
        border-radius: 5px;
        color: inherit;
        text-decoration: none;
      }
      .row:hover {
        background: var(--soft);
      }
      .row-title {
        font-size: 12.5px;
        font-weight: 500;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      /* m22 pin marker — colour only, sitting inside the title cell so an
         unpinned row keeps the same column alignment (SPEC §9). */
      .pin {
        margin-right: 4px;
        color: var(--accent);
        font-size: 11px;
      }
      .row-host {
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--muted);
        text-align: right;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .row-tags {
        display: flex;
        gap: 4px;
      }
      .tag {
        padding: 1px 6px;
        border-radius: 4px;
        background: var(--chip-bg);
        font-family: var(--mono);
        font-size: 10px;
        color: var(--chip-fg);
        white-space: nowrap;
      }
      .row-time {
        min-width: 44px;
        text-align: right;
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--faint);
      }
      .message {
        padding: 10px 8px;
        font-size: 12px;
        color: var(--message);
      }
      .error-line {
        padding: 10px 8px;
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--err);
      }
      .btn-accent {
        margin-left: 8px;
        padding: 5px 12px;
        border: none;
        border-radius: 6px;
        background: var(--accent);
        font: inherit;
        font-size: 11.5px;
        font-weight: 500;
        color: #fff;
        cursor: pointer;
      }
      .btn-accent:hover {
        filter: brightness(1.1);
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="top">
        <button class="brand" id="brand" type="button" title="Open Smultronstället">
          <span aria-hidden="true">🍓</span> Smultronstället
        </button>
        <!-- Row count, and the `offline` mark when the rows on screen came
             from the snapshot cache rather than a fresh read. -->
        <div class="meta" id="meta"></div>
      </header>

      <input
        class="search"
        id="search"
        type="search"
        autocomplete="off"
        spellcheck="false"
        placeholder="Search bookmarks — press / to focus"
        aria-label="Search bookmarks"
      />

      <section class="section hidden" id="shelf">
        <div class="section-label">
          PINNED <span class="count" id="pin-count"></span>
        </div>
        <div class="cards" id="cards"></div>
      </section>

      <section class="section">
        <div class="section-label" id="log-label">RECENT</div>
        <div class="log" id="log"></div>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
